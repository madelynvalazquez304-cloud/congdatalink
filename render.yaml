services:
  - type: web
    name: airtel-portal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VITE_TELEGRAM_BOT_TOKEN
        sync: false
      - key: VITE_TELEGRAM_CHAT_ID
        sync: false
